<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141210" />
    <title>Steam AI Review Analyzer</title>
    <meta
      name="description"
      content="Buscá un juego y visitá su sala: la IA lee miles de reseñas de Steam y te deja el resumen, los destacados y el veredicto."
    />
    <script>
      // Tema antes del primer paint para evitar flash de tema equivocado
      try {
        var t = localStorage.getItem('sara-theme')
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Schibsted+Grotesk:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
